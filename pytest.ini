[pytest]
# Add current directory to pythonpath so imports like 'from pages...' work
pythonpath = .

# Directory where pytest searches for tests
testpaths = tests

# Test naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI Options:
# -v: Verbose output
# --html=reports/report.html: Automatically generate a self-contained HTML report
# --self-contained-html: Everything (CSS, JS) in one shareable HTML file
addopts = -v --html=reports/report.html --self-contained-html
