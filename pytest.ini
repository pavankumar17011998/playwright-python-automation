[pytest]
# Directory where pytest searches for tests
testpaths = tests

# Test naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI Options:
# -v: Verbose output
# --screenshot only-on-failure: Capture screenshot on test failure
# --tracing retain-on-failure: Record trace file on failure
# --video retain-on-failure: Record video on failure
# Note: pytest-playwright already defaults to chromium if --browser is omitted
addopts = -v --screenshot only-on-failure --tracing retain-on-failure
